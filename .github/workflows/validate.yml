name: Validate Python and JSON
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components
      - run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('custom_components').rglob('*.json')]; json.loads(pathlib.Path('hacs.json').read_text())"

      - run: python -m pip install cryptography
      - run: python -m unittest discover -s tests -p 'test_huami_auth.py'

      - run: python -m unittest discover -s tests -p 'test_huami_activity.py'
